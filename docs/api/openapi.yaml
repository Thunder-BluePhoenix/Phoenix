openapi: 3.1.0
info:
  title: Phoenix Core API
  version: "0.1.0"
  description: |
    Local HTTP API of Phoenix Core (Phase 06). Bound to 127.0.0.1 by default (ADR-0015).

    **Authentication.** Every route except `/api/health` requires
    `Authorization: Bearer <token>`. The token is regenerated on each start and
    written to `<dataDir>/session.token` (mode 0600).

    **Host / Origin.** Requests with a non-loopback `Host` header are rejected
    (DNS-rebinding protection). Browser requests must be same-origin or listed in
    `allowedOrigins`.

    Real-time updates: see [websocket.md](websocket.md).
  license:
    name: GPL-3.0-or-later
    identifier: GPL-3.0-or-later
servers:
  - url: http://127.0.0.1:4870
security:
  - session: []
components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      required: [code, message, details]
      properties:
        code:
          type: string
          enum:
            - CAPABILITY_DISABLED
            - CAPABILITY_UNAVAILABLE
            - PERMISSION_DENIED
            - INVALID_EVENT
            - EVENT_DUPLICATE
            - OPERATION_TIMEOUT
            - RESOURCE_NOT_FOUND
            - ACTION_REQUIRES_CONFIRMATION
            - SECURITY_POLICY_BLOCKED
            - INVALID_REQUEST
            - UNAUTHENTICATED
            - INTERNAL_ERROR
        message: { type: string }
        details: { type: array, items: { type: string } }
    Event:
      $ref: "../../protocol/schemas/event-v1.schema.json"
    StateSnapshot:
      type: object
      required: [state, explanation, since, recording, sleeping, conditions]
      properties:
        state:
          type: string
          enum:
            [
              ERROR,
              WAITING,
              RECORDING,
              WARNING,
              DEPLOYING,
              THINKING,
              LISTENING,
              WORKING,
              SUCCESS,
              IDLE,
              SLEEPING,
              OFFLINE,
            ]
        explanation: { type: string }
        since: { type: string, format: date-time }
        key: { type: string }
        source: { type: string }
        recording:
          {
            type: boolean,
            description: "True whenever any recording is active, regardless of displayed state.",
          }
        sleeping: { type: boolean }
        conditions: { type: array, items: { type: object } }
    ActiveTask:
      type: object
      required: [key, state, title, source, since, updatedAt]
      properties:
        key: { type: string }
        state: { type: string }
        title: { type: string }
        source: { type: string }
        since: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        progress: { type: number, minimum: 0, maximum: 1 }
    Confirmation:
      type: object
      properties:
        id: { type: string }
        capabilityId: { type: string }
        command: { type: string }
        summary: { type: string }
        sideEffect: { type: string, enum: [none, read, write, execute, external, production] }
        permissions: { type: array, items: { type: string } }
        requestedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
paths:
  /api/health:
    get:
      summary: Core health (public)
      security: []
      responses:
        "200": { description: Health, content: { application/json: { schema: { type: object } } } }
  /api/pet/state:
    get:
      summary: Current Fawkes state
      responses:
        "200":
          {
            description: Snapshot,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/StateSnapshot" } } },
          }
        "401": { $ref: "#/components/responses/Error" }
  /api/pet/tasks:
    get:
      summary: Active long-running tasks
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties:
                    { tasks: { type: array, items: { $ref: "#/components/schemas/ActiveTask" } } },
                }
  /api/pet/sleep:
    post:
      summary: Pause or resume Fawkes (persisted)
      requestBody:
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [sleeping],
                    properties: { sleeping: { type: boolean } },
                  },
              },
          }
      responses:
        "200":
          {
            description: Snapshot,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/StateSnapshot" } } },
          }
        "400": { $ref: "#/components/responses/Error" }
  /api/pet/acknowledge:
    post:
      summary: Dismiss one condition by key, or all errors when key is omitted
      requestBody:
        content:
          { application/json: { schema: { type: object, properties: { key: { type: string } } } } }
      responses:
        "200":
          {
            description: Count,
            content:
              {
                application/json:
                  { schema: { type: object, properties: { acknowledged: { type: integer } } } },
              },
          }
        "404": { $ref: "#/components/responses/Error" }
  /api/pet/settings:
    get:
      summary: Fawkes appearance settings, shared by every Fawkes view
      responses:
        "200": { description: '{ reduced_motion: "auto" | "on" | "off" }' }
    post:
      summary: Update Fawkes appearance settings
      requestBody:
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [reduced_motion],
                    properties: { reduced_motion: { enum: [auto, "on", "off"] } },
                  },
              },
          }
      responses:
        "200": { description: Settings }
        "400": { $ref: "#/components/responses/Error" }
  /api/ui/settings:
    get:
      summary: >-
        Interface language (Phase 70): the saved locale (default en) and the supported codes
        (en, zh, hi, es, ar, fr, bn, pt, ru, id). Every view reads it.
      responses:
        "200": { description: "{ locale, supported }" }
    post:
      summary: Set the interface language; publishes ui.settings.changed
      requestBody:
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [locale],
                    properties: { locale: { enum: [en, zh, hi, es, ar, fr, bn, pt, ru, id] } },
                  },
              },
          }
      responses:
        "200": { description: Settings }
        "400": { $ref: "#/components/responses/Error" }
  /api/ui/sounds:
    get:
      summary: >-
        Fawkes sounds (Phase 59): { enabled, volume }. Off by default; volume is a whole percent
        (default 60). Quiet mode, quiet hours, mute, the emergency stop and the demo silence sounds
        in the page regardless of these values.
      responses:
        "200": { description: "{ enabled, volume }" }
    post:
      summary: Set the sound switch and/or the volume; publishes ui.sounds.changed
      requestBody:
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    additionalProperties: false,
                    minProperties: 1,
                    properties:
                      {
                        enabled: { type: boolean },
                        volume: { type: integer, minimum: 0, maximum: 100 },
                      },
                  },
              },
          }
      responses:
        "200": { description: "{ enabled, volume }" }
        "400": { $ref: "#/components/responses/Error" }
  /api/events:
    get:
      summary: Recent durable events, newest first
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 1000, default: 100 },
          }
        - { name: after_seq, in: query, schema: { type: integer, minimum: 0 } }
        - { name: source, in: query, schema: { type: string } }
        - {
            name: type,
            in: query,
            description: "Exact type or prefix ending in .*",
            schema: { type: string },
          }
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      {
                        type: object,
                        properties:
                          {
                            seq: { type: integer },
                            event: { $ref: "#/components/schemas/Event" },
                            description: { type: string },
                          },
                      }
    post:
      summary: Publish an event (local tools, simulator). Source "core" is reserved.
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } }
      responses:
        "202":
          {
            description: Accepted,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          { event_id: { type: string }, seq: { type: [integer, "null"] } },
                      },
                  },
              },
          }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /api/capabilities:
    get:
      summary: Installed capabilities, including disconnected external ones
      responses:
        "200":
          {
            description: List,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties: { capabilities: { type: array, items: { type: object } } },
                      },
                  },
              },
          }
  /api/capabilities/{id}/enable:
    post:
      summary: Enable a capability
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Capability }
        "404": { $ref: "#/components/responses/Error" }
  /api/capabilities/{id}/disable:
    post:
      summary: Disable a capability
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Capability }
        "404": { $ref: "#/components/responses/Error" }
  /api/capabilities/register:
    post:
      summary: Register an external capability process (loopback endpoint only)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [manifest, endpoint]
              properties:
                manifest: { $ref: "../../protocol/schemas/capability-manifest-v1.schema.json" }
                endpoint: { type: string, example: "http://127.0.0.1:8765" }
                callback_secret:
                  {
                    type: string,
                    minLength: 32,
                    description: "Secret core presents when calling the capability. Defaults to the issued token.",
                  }
      responses:
        "201":
          description: Registered. `token` authenticates the capability's events (ADR-0016).
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      properties: { capability: { type: object }, token: { type: string } },
                    },
                },
            }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/capabilities/{id}:
    get:
      summary: One capability
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Capability }
        "404": { $ref: "#/components/responses/Error" }
  /api/capabilities/{id}/config:
    post:
      summary: Set configuration (validated against config_schema; secrets rejected)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          {
            application/json:
              { schema: { type: object, properties: { config: { type: object } } } },
          }
      responses:
        "200": { description: Capability }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/capabilities/{id}/secrets/{name}:
    post:
      summary: Store a credential (e.g. Kage api_key) in OS secret storage. Write-only; values are never returned.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - {
            name: name,
            in: path,
            required: true,
            schema: { type: string, pattern: "^[a-z][a-z0-9_]{0,63}$" },
          }
      requestBody:
        content:
          {
            application/json:
              {
                schema:
                  { type: object, required: [value], properties: { value: { type: string } } },
              },
          }
      responses:
        "200": { description: "Capability (its `secrets` lists stored names)" }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove a stored credential
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Capability }
  /api/capabilities/{id}/uninstall:
    post:
      summary: Disable, revoke permissions and remove; optionally keep its event history
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          {
            application/json:
              {
                schema:
                  { type: object, properties: { retain_data: { type: boolean, default: false } } },
              },
          }
      responses:
        "200": { description: Removed }
  /api/capabilities/{id}/commands/{command}:
    post:
      summary: Start a command. Returns an operation immediately; it may wait for user confirmation.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: command, in: path, required: true, schema: { type: string } }
      requestBody:
        content: { application/json: { schema: { type: object, properties: { input: {} } } } }
      responses:
        "202": { description: Operation started }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/operations/{id}:
    get:
      summary: Status and result of a command operation
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "Operation (pending | running | succeeded | failed)" }
        "404": { $ref: "#/components/responses/Error" }
  /api/capabilities/{id}/events:
    post:
      summary: Submit an event as an external capability
      description: Authenticated with the `X-Phoenix-Capability-Token` header instead of the session token. Source must equal the capability id and the type must be declared in its manifest.
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: X-Phoenix-Capability-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } }
      responses:
        "202": { description: Accepted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/meetings:
    get:
      summary: Meetings from meeting capabilities (Kage), newest first. Deleted meetings never appear.
      parameters:
        - { name: archived, in: query, schema: { type: boolean, default: false } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }
      responses:
        "200": { description: "{ meetings: Meeting[] }" }
  /api/meetings/{id}:
    get:
      summary: "One meeting (id = <capability>:<external id>, e.g. kage:12)"
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Meeting metadata, status and recording reference }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete Phoenix's copy (purged, never re-imported). The recording itself stays in Kage.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          {
            application/json:
              {
                schema:
                  { type: object, required: [confirm], properties: { confirm: { const: true } } },
              },
          }
      responses:
        "200": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/meetings/{id}/transcript:
    get:
      summary: "Transcript ({ text, segments? })"
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Transcript }
        "404": { $ref: "#/components/responses/Error" }
  /api/meetings/{id}/summary:
    get:
      summary: "Summary ({ text, generated_by, topics, decisions, action_items, follow_up_questions })"
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Summary }
        "404": { $ref: "#/components/responses/Error" }
  /api/meetings/{id}/archive:
    post:
      summary: 'Archive (default) or unarchive with {"archived": false}'
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Meeting }
        "404": { $ref: "#/components/responses/Error" }
  /api/privacy:
    get:
      summary: What Phoenix stores (counts, retention, location), stored credential names, telemetry and AI statements
      responses:
        "200": { description: Privacy inventory }
  /api/privacy/retention:
    post:
      summary: "Days to keep each data class (events, notifications, meetings); null keeps until deleted. Applied immediately and hourly."
      requestBody:
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    properties:
                      {
                        events: { type: [integer, "null"], minimum: 1, maximum: 3650 },
                        notifications: { type: [integer, "null"], minimum: 1, maximum: 3650 },
                        meetings: { type: [integer, "null"], minimum: 1, maximum: 3650 },
                      },
                  },
              },
          }
      responses:
        "200": { description: Retention }
        "400": { $ref: "#/components/responses/Error" }
  /api/privacy/delete:
    post:
      summary: Delete every record of one data class (audited). The audit log itself is not deletable here.
      requestBody:
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [data, confirm],
                    properties:
                      {
                        data:
                          {
                            enum:
                              [
                                events,
                                notifications,
                                meetings,
                                memory,
                                recap,
                                phone,
                                mcp,
                                agent_usage,
                              ],
                          },
                        confirm: { const: true },
                      },
                  },
              },
          }
      responses:
        "200": { description: "{ deleted: number }" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/notifications:
    get:
      summary: Recent notifications, newest first, with the unread count
      parameters:
        - { name: unread_only, in: query, schema: { type: boolean } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications: { type: array, items: { type: object } }
                  unread: { type: integer }
  /api/notifications/{id}/read:
    post:
      summary: Mark one notification read
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Notification }
        "404": { $ref: "#/components/responses/Error" }
  /api/notifications/read-all:
    post:
      summary: Mark every notification read
      responses:
        "200": { description: "Count: { marked }" }
  /api/notifications/preferences:
    get:
      summary: Notification preferences
      responses:
        "200": { description: Preferences }
    post:
      summary: Update notification preferences
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                min_severity: { type: string, enum: [warning, error] }
                muted_sources: { type: array, items: { type: string } }
      responses:
        "200": { description: Preferences }
        "400": { $ref: "#/components/responses/Error" }
  /api/permissions:
    get:
      summary: Active permission grants
      parameters: [{ name: capability, in: query, schema: { type: string } }]
      responses:
        "200": { description: Grants }
  /api/permissions/{capability}/revoke:
    post:
      summary: Revoke some or all permissions of a capability
      parameters: [{ name: capability, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    properties: { permissions: { type: array, items: { type: string } } },
                  },
              },
          }
      responses:
        "200": { description: Remaining grants }
        "400": { $ref: "#/components/responses/Error" }
  /api/confirmations:
    get:
      summary: Actions waiting for user approval
      responses:
        "200":
          description: Pending
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties:
                    {
                      confirmations:
                        { type: array, items: { $ref: "#/components/schemas/Confirmation" } },
                    },
                }
  /api/confirmations/{id}:
    post:
      summary: Approve or reject a pending action
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          {
            application/json:
              {
                schema:
                  { type: object, required: [approve], properties: { approve: { type: boolean } } },
              },
          }
      responses:
        "200": { description: Resolved }
        "404": { $ref: "#/components/responses/Error" }
  /api/diagnostics:
    get:
      summary: Support report with no secrets and no meeting content
      description: |
        How Phoenix is behaving, for a bug report: versions, counts, bus and WebSocket metrics,
        capability status (names only, never configuration values), dead letters, recent event
        types and sources (never payloads or subjects), recent audit actions and how long Kage
        meetings took to process. Never includes meeting titles, participants, transcripts,
        summaries, credentials or file paths.
      responses:
        "200": { description: Report }
  /api/audit:
    get:
      summary: Audit log, newest first
      parameters:
        - { name: capability, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200": { description: Entries }
  /api/recap:
    get:
      summary: >-
        Weekly recap (Phase 69), Monday-start local week: time coding, sessions, files, lines
        changed, commands, permissions granted/denied (audit log), top agent and project, busiest
        day, longest session, commits, CI outcomes, meetings and decisions (only while sensitive
        meeting data is allowed) and a 53-week commit grid counted locally from git.commit.created
        events. Counts only; no file names, commands or text. All local, no AI.
      parameters:
        - {
            name: week,
            in: query,
            description: "Any local day YYYY-MM-DD of the wanted week; default this week",
            schema: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" },
          }
      responses:
        "200": { description: Recap }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete all recap statistics (audited; same as POST /api/privacy/delete {data:recap})
      parameters:
        - { name: confirm, in: query, required: true, schema: { type: string, enum: ["true"] } }
      responses:
        "200": { description: "{ deleted: number }" }
        "409": { $ref: "#/components/responses/Error" }
  /api/mission:
    get:
      summary: >-
        Mission control (Phase 78): every agent session by state (working, waiting, finished,
        stuck; mapping in docs/mission-control.md) with its reported tokens and cost, and tokens and
        cost per day, agent, project and session over the last `days` local days, budget progress.
        Everything is what the agents themselves reported, not verified against a provider's bill;
        a cost is null (never zero) when unknown.
      parameters:
        - {
            name: days,
            in: query,
            description: "1-90, default 14",
            schema: { type: integer, minimum: 1, maximum: 90 },
          }
      responses:
        "200": { description: Mission }
        "400": { $ref: "#/components/responses/Error" }
  /api/mission/config:
    get:
      summary: Budgets, the user's own agent prices (USD per million tokens; none are built in), the stall limit, the usage retention (`keep_days`) and the alert thresholds
      responses:
        "200": { description: Config }
    post:
      summary: >-
        Replace any of `budgets` (daily or session, tokens or cost, at most 20), `prices` (keyed by
        the model id an agent reports), `stuck_after_min` (5-1440) and `keep_days` (whole days of
        usage kept, 7-3650, default 400; older rows are dropped on the next report or at Core start).
        The whole request is checked first; a bad part saves nothing.
      responses:
        "200": { description: Config }
        "400": { $ref: "#/components/responses/Error" }
  /api/mission/usage:
    delete:
      summary: Delete all stored agent token and cost numbers (audited; same as POST /api/privacy/delete {data:agent_usage})
      parameters:
        - { name: confirm, in: query, required: true, schema: { type: string, enum: ["true"] } }
      responses:
        "200": { description: "{ deleted: number }" }
        "409": { $ref: "#/components/responses/Error" }
  /api/phone/status:
    get:
      summary: >-
        Phone link (Phase 71) status: enabled (default false), whether the separate LAN HTTPS
        listener is up, its address and port, the configured port (`configured_port`, default 47821)
        used the next time it opens, the certificate SHA-256 fingerprint a phone must pin,
        the require_user_verification setting (default true), the kill switch, whether a pairing
        code is live (its expiry only, never the code), a pending pair request with the phone's key
        fingerprint and the confirmation id to answer through POST /api/confirmations/{id}, and the
        pairing lockout. The LAN listener is NOT part of this API; see docs/phone-link.md.
      responses:
        "200": { description: Status }
  /api/phone/settings:
    post:
      summary: >-
        Enable or disable the phone link, choose the LAN address, choose the listener port, or set
        require_user_verification (audited). Enabling starts a separate HTTPS listener on one LAN
        address (never the loopback API port); refused while the kill switch is engaged. A new
        address or port reopens a running (or enabled) listener at once and withdraws any live
        pairing code; the port must be a whole number from 1024 to 65535 and not a port Core itself
        uses (the loopback API or the MCP server).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                enabled: { type: boolean }
                require_user_verification: { type: boolean }
                address: { type: [string, "null"] }
                port: { type: integer, minimum: 1024, maximum: 65535 }
      responses:
        "200": { description: Status }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/phone/pairing:
    post:
      summary: >-
        Start a pairing: returns the single-use, two-minute pairing code ONCE (shown only in the
        desktop UI, never logged), the certificate fingerprint to compare on the phone, and a
        phoenixphone:// URI. The phone then registers its public key; a person confirms
        "Pair <name>?" in the desktop UI. Core cannot tell a person from a program holding the
        session token (see docs/phone-link.md).
      responses:
        "201": { description: Pairing code }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      summary: Cancel the live pairing code and any pending pair request
      responses:
        "200": { description: "{ cancelled: true }" }
  /api/phone/devices:
    get:
      summary: Paired phones (name, public-key fingerprint, created, last seen, revoked). Never a key or a code.
      responses:
        "200": { description: "{ devices: [...] }" }
  /api/phone/devices/{id}:
    delete:
      summary: >-
        Revoke a paired phone (audited). It fails on its next request, at once. Closes the Phase 45
        device-revocation gap for the phone link ONLY; relay revocation is separate.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ id, revoked: true }" }
        "404": { $ref: "#/components/responses/Error" }
  /api/handoff/notes:
    get:
      summary: >-
        Handoff notes (Phase 79), newest first, without their text. Stored under <dataDir>/handoff
        (0600, at most 50). docs/handoff-and-secret-guard.md.
      responses:
        "200": { description: "{ notes }" }
    post:
      summary: >-
        Build a note from a live agent session ({ session_id }) with rules only; no model. 404 when
        the session is unknown, refused while the emergency stop is engaged.
      responses:
        "201": { description: The note with its text }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/handoff/notes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: One note with its text.
      responses:
        "200": { description: The note }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete one note (audited).
      responses:
        "200": { description: "{ id, deleted: true }" }
        "404": { $ref: "#/components/responses/Error" }
  /api/handoff/notes/{id}/summary:
    post:
      summary: >-
        Add a model summary. Local only (data class sensitive) unless allow_cloud is on, and then the
        user's AI grants still apply. A non-local answer is discarded while cloud is not allowed.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The note with its summary }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/handoff/notes/{id}/attach:
    post:
      summary: >-
        Attach a note to commit_message, pr_description (both copy only, not wired) or task (a GitHub
        issue through the permission gateway). Without confirm_hash it is a preview and writes
        nothing; with the preview's hash it applies. A stale or foreign hash is refused.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: A preview or the applied result }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/handoff/settings:
    get:
      summary: "{ auto, allow_cloud }. Automatic notes default on; cloud summaries default off."
      responses:
        "200": { description: Handoff settings }
    post:
      summary: Change auto and/or allow_cloud (booleans). Audited.
      responses:
        "200": { description: Handoff settings }
        "400": { $ref: "#/components/responses/Error" }
  /api/secret-guard:
    get:
      summary: >-
        Secret guard counts (blocked, overridden, allowed) and the most recent rows, read from the
        audit log. Kinds and places only, never a secret.
      responses:
        "200": { description: Secret guard status }
  /api/secret-guard/result:
    post:
      summary: >-
        The guard hook reports a block, an override or a clean commit/push. Refuses a payload that
        holds a secret; an override is recorded only if the audit log shows the owner allowed a
        SecretGuard approval carrying the same content hash.
      responses:
        "200": { description: Recorded }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/mcp/status:
    get:
      summary: >-
        Phoenix MCP server (Phase 76): enabled, listening, port, the loopback URL while listening, kill
        switch, number of active clients. Off by default; docs/mcp-server.md.
      responses:
        "200": { description: MCP server status }
  /api/mcp/settings:
    post:
      summary: >-
        Turn the MCP listener on or off and/or change its port (1024-65535). The listener binds
        127.0.0.1 only. Audited. Refused while the emergency stop is engaged.
      responses:
        "200": { description: MCP server status }
        "400": { $ref: "#/components/responses/Error" }
  /api/mcp/clients:
    get:
      summary: MCP clients with their grants and last use. Never carries a token or its hash.
      responses:
        "200": { description: "{ clients }" }
    post:
      summary: >-
        Add a client by name. Answers 201 with { client, token } and Cache-Control no-store; the
        token is shown ONCE and only its SHA-256 is stored. A new client has no grants.
      responses:
        "201": { description: "{ client, token }" }
        "400": { $ref: "#/components/responses/Error" }
  /api/mcp/clients/{id}/grants:
    post:
      summary: >-
        Replace a client's grants { tools, memory, request_approval, notify }. Strictly validated;
        takes effect on the client's next call. Audited.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The client }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/mcp/clients/{id}:
    delete:
      summary: Revoke a client (audited). It is refused on its very next request, even mid-call.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ id, revoked: true }" }
        "404": { $ref: "#/components/responses/Error" }
  /api/voice/status:
    get:
      summary: "« OK Fawkes » voice assistant (Phase 66): enabled, kill switch, on-device recogniser availability, the active session and its phase (waiting | awake | thinking), limits. audio_on_disk is always false."
      responses:
        "200": { description: Voice status }
  /api/voice/settings:
    get:
      summary: Voice settings ({ enabled }); off by default
      responses:
        "200": { description: Settings }
    post:
      summary: Turn the voice assistant on or off. Turning it off ends any session and zeroes its audio. Audited.
      requestBody:
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [enabled],
                    properties: { enabled: { type: boolean } },
                    additionalProperties: false,
                  },
              },
          }
      responses:
        "200": { description: Settings }
        "400": { $ref: "#/components/responses/Error" }
  /api/voice/sessions:
    post:
      summary: >-
        Start a listening session (body `{}`). Audio then goes over the single-use same-origin
        WebSocket /api/voice/stream?session=<id> (binary 16 kHz mono 16-bit PCM only; the
        server sends ready, state, reply and error frames). Refused (409) while voice is off or the
        emergency stop is engaged, 503 without a local recogniser. Voice may deny waiting
        confirmations but can never approve one; tool calls run as an untrusted actor through the
        tool gateway, read-only tools only.
      responses:
        "200": { description: "{ id }" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/voice/sessions/{id}:
    delete:
      summary: Stop a voice session (idempotent); its audio is zeroed
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "{ stopped: true }" }
  /api/security/kill-switch:
    get:
      summary: Emergency stop status
      responses:
        "200":
          {
            description: Status,
            content:
              {
                application/json:
                  { schema: { type: object, properties: { engaged: { type: boolean } } } },
              },
          }
    post:
      summary: Engage or release the emergency stop for all capabilities
      requestBody:
        content:
          {
            application/json:
              {
                schema:
                  { type: object, required: [engaged], properties: { engaged: { type: boolean } } },
              },
          }
      responses:
        "200": { description: Status }
  /api/demo/start:
    post:
      summary: Start demo mode (Phase 70), an isolated in-memory Core
      description: |
        Starts a second Core with an in-memory database, memory-only secrets, no token file, no agent
        relay, no network and only the mock capability. The returned token is valid only on the returned
        URL (the real Core rejects it, and the demo Core rejects the real token). Refused with 403 while
        the real emergency stop is engaged and with 400 while a demo is already running. It stops
        itself after being idle, on `POST /api/demo/stop`, or when Core stops.
      responses:
        "200":
          description: Where the demo Core listens and how to talk to it
          content:
            application/json:
              schema:
                type: object
                required: [url, token, steps]
                properties:
                  url: { type: string, description: "http://127.0.0.1:<port>" }
                  token: { type: string }
                  steps:
                    type: array
                    items:
                      type: object
                      required: [scenario, caption_id, caption, route]
                      properties:
                        scenario: { type: string }
                        caption_id: { type: string }
                        caption: { type: string }
                        route: { type: string }
        "400": { description: A demo is already running }
        "403": { description: Emergency stop is engaged }
  /api/demo/stop:
    post:
      summary: Stop the demo Core (idempotent)
      responses:
        "200":
          description: Whether a demo was running
          content:
            application/json:
              schema:
                type: object
                properties: { stopped: { type: boolean } }
  /api/demo/status:
    get:
      summary: Whether a demo is running
      responses:
        "200":
          description: Demo status
          content:
            application/json:
              schema:
                type: object
                properties:
                  running: { type: boolean }
                  step_count: { type: integer }
                  idle_limit_ms: { type: integer }
