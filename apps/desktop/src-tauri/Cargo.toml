[package]
name = "phoenix-desktop"
version = "0.1.0"
description = "Floating desktop Fawkes"
authors = ["Phoenix contributors"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: required for a transparent window on macOS (not App Store compatible).
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"

# Island window styling on macOS: window level above the menu bar, all Spaces, and notch
# detection through NSScreen (safe-area inset + auxiliary areas). Same versions tauri/tao
# already pull in, so no new crate enters the lockfile.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSScreen", "NSWindow", "NSResponder", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString", "NSArray"] }
core-graphics = "0.25"
core-foundation = "0.10"

# Island window on Linux: the GTK window handle (same gtk 0.18 tauri uses) and libloading, which
# is already in the lockfile through tauri's dependencies. libgtk-layer-shell is opened with
# dlopen at run time, not linked, so a system without it still starts (plain/dock-hint window).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
libloading = "0.7"
x11-dl = "2.21"

# Island window on Windows: extended window styles (no activation, tool window, topmost).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
tempfile = "3"
# Mock runtime for the window/tray lifecycle tests (tests/lifecycle.rs).
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "test"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# macOS only allows menus and tray icons on the main thread, which the default test
# harness never uses; this test runs its own main().
[[test]]
name = "lifecycle"
harness = false
