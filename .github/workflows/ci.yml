name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint (license headers + formatting)
        run: pnpm lint
      - name: Test (includes event schema validation)
        run: pnpm test
      - name: Build web app
        run: pnpm build:web

  # AI evaluation (Phase 33, ADR-0010). Offline only: scripted models and fake capabilities, no
  # network, no Ollama. The test step fails on any regression against the committed baseline
  # (ai/evaluation/golden/offline-report.json). The gate step runs the approved v0.4 release gate
  # and fails the job if it does not pass (D1-D3 are fixed; see docs/release-gates.md).
  ai-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the SDK artifact (the evaluation tools import its public entry)
        run: pnpm --filter @phoenix/sdk build
      - name: Offline evaluation and adversarial suite
        run: npx vitest run ai/evaluation
      - name: Release gate v0.4 (verdict)
        run: |
          npx tsx ai/evaluation/src/cli.ts run
          npx tsx ai/evaluation/src/cli.ts gate v0.4

  # The desktop shell (Phase 14, Phase 60). Built and tested on all three OSes. macOS is the only
  # one a person has run the app on; the Linux and Windows jobs prove it compiles, lints and
  # passes the unit/lifecycle tests there, not that the island looks right on those desktops.
  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Tauri v2 Linux prerequisites (https://v2.tauri.app/start/prerequisites/#linux).
      - name: Install Tauri system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      # tauri::generate_context! needs the built web app (frontendDist) at compile time.
      - name: Build web app
        run: pnpm build:web
      - name: Format
        run: cargo fmt --check
        working-directory: apps/desktop/src-tauri
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: apps/desktop/src-tauri
      # The lifecycle test builds GTK menus on Linux, which needs a display: run under xvfb.
      - name: Test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --locked
        working-directory: apps/desktop/src-tauri
      - name: Test
        if: runner.os != 'Linux'
        run: cargo test --locked
        working-directory: apps/desktop/src-tauri

  # Known-vulnerability scan. Fails on any advisory, so a new one shows up on the next push.
  # cargo audit only warns (exit 0) for unmaintained/unsound crates, which today are Linux-only
  # GTK crates that the macOS build does not contain (see docs/licenses/INVENTORY.md).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: npm advisories
        run: pnpm audit
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Rust advisories
        run: cargo audit
        working-directory: apps/desktop/src-tauri
      # THIRD_PARTY_NOTICES.md is generated from the lockfiles; a dependency change that does
      # not regenerate it fails here.
      - name: Fetch crate sources (licence texts)
        run: cargo fetch --locked
        working-directory: apps/desktop/src-tauri
      - name: Third-party notices are up to date
        run: node scripts/generate-third-party-notices.mjs --check

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
